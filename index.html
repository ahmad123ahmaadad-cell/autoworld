<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamar Cars</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f5f7;
  color:#111;
}

/* شاشة البداية */
#splash{
  position:fixed;
  inset:0;
  background:#080808;
  color:white;
  z-index:9999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  animation:hideSplash .5s ease 2s forwards;
}

#splash h1{
  font-size:38px;
  letter-spacing:2px;
}

#splash p{
  margin-top:10px;
  color:#aaa;
}

.car-animation{
  font-size:65px;
  margin-bottom:20px;
  animation:carMove 1.8s ease-in-out;
}

@keyframes carMove{
  0%{transform:translateX(-180px);opacity:0}
  30%{opacity:1}
  70%{opacity:1}
  100%{transform:translateX(180px);opacity:0}
}

@keyframes hideSplash{
  to{opacity:0;visibility:hidden}
}

/* الهيدر */
header{
  background:#111;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px;
  font-weight:bold;
  text-align:center;
  letter-spacing:1px;
}

.search{
  margin-top:15px;
}

.search input{
  width:100%;
  padding:14px 16px;
  border:none;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

/* الأقسام */
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:15px;
  background:white;
}

.categories button{
  white-space:nowrap;
  border:none;
  background:#eee;
  padding:11px 17px;
  border-radius:20px;
  font-size:14px;
}

.categories button.active{
  background:#111;
  color:white;
}

/* العناوين */
.section-title{
  padding:20px 15px 10px;
  font-size:21px;
  font-weight:bold;
}

/* السيارات */
.cars{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:0 12px;
}

.car{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px #ddd;
}

.car img{
  width:100%;
  height:145px;
  object-fit:cover;
}

.car-info{
  padding:11px;
}

.car-info h3{
  font-size:16px;
  margin-bottom:6px;
}

.country{
  color:#777;
  font-size:12px;
}

.price{
  color:#00833b;
  font-weight:bold;
  font-size:17px;
  margin:8px 0;
}

.details{
  width:100%;
  border:none;
  background:#111;
  color:white;
  padding:10px;
  border-radius:9px;
}

/* إضافة إعلان */
.add{
  margin:25px 15px 90px;
  background:#111;
  color:white;
  padding:16px;
  text-align:center;
  border-radius:13px;
  font-size:17px;
}

/* القائمة السفلية */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 5px;
  box-shadow:0 -2px 10px #ddd;
  z-index:200;
}

.bottom button{
  border:none;
  background:none;
  font-size:12px;
}

.bottom span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<!-- شاشة البداية -->
<div id="splash">
  <div class="car-animation">🚗</div>
  <h1>LAMAR CARS</h1>
  <p>Cars • Parts • Rental • Shipping</p>
</div>

<!-- الهيدر -->
<header>
  <div class="logo">LAMAR CARS</div>

  <div class="search">
    <input
      id="search"
      type="text"
      placeholder="🔍 ابحث عن سيارة، قطعة..."
      oninput="searchCars()"
    >
  </div>
</header>

<!-- الأقسام -->
<div class="categories">
  <button class="active">🚗 الكل</button>
  <button>🚘 سيارات للبيع</button>
  <button>🔧 قطع سيارات</button>
  <button>🚙 سيارات للإيجار</button>
  <button>🚚 شحن سيارات</button>
</div>

<h2 class="section-title">سيارات مقترحة لك</h2>

<div class="cars" id="cars">

  <div class="car">
    <img src="https://images.unsplash.com/photo-1553440569-bcc63803a83d">
    <div class="car-info">
      <h3>Mercedes-Benz C-Class</h3>
      <div class="country">🇩🇪 ألمانيا</div>
      <div class="price">$35,000</div>
      <button class="details" onclick="contact()">عرض التفاصيل</button>
    </div>
  </div>

  <div class="car">
    <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2">
    <div class="car-info">
      <h3>BMW 5 Series</h3>
      <div class="country">🇩🇪 ألمانيا</div>
      <div class="price">$28,000</div>
      <button class="details" onclick="contact()">عرض التفاصيل</button>
    </div>
  </div>

  <div class="car">
    <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70">
    <div class="car-info">
      <h3>Porsche 911</h3>
      <div class="country">🇺🇸 أمريكا</div>
      <div class="price">$55,000</div>
      <button class="details" onclick="contact()">عرض التفاصيل</button>
    </div>
  </div>

  <div class="car">
    <img src="https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6">
    <div class="car-info">
      <h3>Audi Q8</h3>
      <div class="country">🇦🇪 الإمارات</div>
      <div class="price">$48,000</div>
      <button class="details" onclick="contact()">عرض التفاصيل</button>
    </div>
  </div>

</div>

<!-- زر نشر إعلان -->
<div class="add" onclick="addAd()">
  ➕ نشر إعلان جديد
</div>

<!-- القائمة السفلية -->
<div class="bottom">
  <button onclick="home()">
    <span>🏠</span>
    الرئيسية
  </button>

  <button onclick="addAd()">
    <span>➕</span>
    نشر
  </button>

  <button onclick="contact()">
    <span>💬</span>
    الرسائل
  </button>

  <button>
    <span>👤</span>
    حسابي
  </button>
</div>

<script>

/* البحث */
function searchCars(){

  let text =
    document.getElementById("search")
    .value
    .toLowerCase();

  let cars =
    document.querySelectorAll(".car");

  cars.forEach(function(car){

    let name =
      car.querySelector("h3")
      .innerText
      .toLowerCase();

    if(name.includes(text)){
      car.style.display="block";
    }else{
      car.style.display="none";
    }

  });
}

/* التواصل */
function contact(){
  alert("سيتم فتح المحادثة مع صاحب الإعلان 💬");
}

/* إضافة إعلان */
function addAd(){

  let title =
    prompt("اكتب اسم السيارة أو القطعة:");

  if(!title) return;

  let price =
    prompt("اكتب السعر:");

  let country =
    prompt("اكتب الدولة:");

  alert(
    "تم تجهيز إعلانك:\n\n"+
    title+"\n"+
    "السعر: "+price+"\n"+
    "الدولة: "+country
  );
}

/* الرئيسية */
function home(){
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* حفظ الدخول */
if(localStorage.getItem("lamarVisited")){
  document.getElementById("splash").style.display="none";
}else{
  localStorage.setItem("lamarVisited","yes");
}

</script>

</body>
</html>
